    <meta name="theme-color" content="#0D0D12">
    <!--
      Theme class before first paint.

      The stylesheet scopes the light palette to `:root:not(.dark)`, so until
      `applyStoredTheme()` runs (a module script, i.e. *after* the DOM is parsed) an
      unclassed page resolves the LIGHT surface — and `html`'s background is
      `var(--color-m3-surface)`, so the html element is near-white for that window.
      On Android with edge-to-edge the WebView exposes that html background at the
      bottom (the nav-bar / overscroll strip) *before* the app draws, which read as a
      white flash on launch. `applyStoredTheme()` cannot run earlier — this is a
      blocking inline script in <head>, so it wins the race against the first paint.

      It duplicates `applyStoredTheme` on purpose (a classic script in index.html
      cannot import the module); the two must stay in step. Wrapped so private-mode
      storage or a missing matchMedia cannot break the boot.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('app-theme');
          var theme = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system';
          var prefersDark = typeof window.matchMedia === 'function'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : false;
          var isDark = theme === 'system' ? prefersDark : theme === 'dark';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(isDark ? 'dark' : 'light');
          root.classList.toggle('key-blue', localStorage.getItem('app-key-color') === 'blue');
          // Clamp the document before first paint. The crawler footer below #root
          // makes the document taller than the viewport, and `app-viewport` (see
          // index.css) hides that overflow — but it was added by a module script, i.e.
          // after parse, so a scrollbar flashed on the right for that window and then
          // vanished when the class landed. Applying it here removes the flash, and a
          // no-JavaScript client never runs this, so it still gets the scrollable page
          // with the footer as its body.
          root.classList.add('app-viewport');
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.add('app-viewport');
        }
      })();
    </script>

    <!-- The app is a client-rendered SPA, so the served HTML must itself carry the
         facts a client that does not run JavaScript needs — a crawler, a link-preview
         bot, an SEO checker, or the reviewer checking our OAuth branding. Google's
         brand verification requires the home page to be publicly accessible, to say
         what the app does, and to link to the privacy policy. Every fact they need —
         the title, the description, the canonical URL, the Open Graph and Twitter
         cards, and the two claims below (agent-friendly, made by KiraEqual) — lives in
         this served HTML and never depends on a script.

         This block used to be hidden (`display:none`, un-hidden only inside noscript).
         That served no-JavaScript clients but left the page Google *actually* indexed
         as a ~100-character onboarding greeting, because Google does run JavaScript.
         It now lives OUTSIDE `#root`, always present, as an ordinary page footer: a
         no-JavaScript client reads it as the page body, a crawler sees the real,
         visible content it is, and it stays in the rendered DOM for a JS client too.
         Living outside `#root` is load-bearing — index.tsx calls
         `container.replaceChildren()` on mount and would otherwise wipe it. Always
         present also drops the old hide-then-reveal dance that Cloudflare's Rocket
         Loader used to break.

         One correction earned the hard way (2026-10-11): "the JS client scrolls to it
         below the app" sounded like a feature and shipped as a bug — every page's
         scroll, chained past the shell's end, dragged this footer into view. Once the
         bundle runs it adds the `app-viewport` class (see index.tsx and index.css),
         which clamps the document to the viewport; the footer stays in the DOM and in
         the crawler's view, but no signed-in user ever scrolls onto it again. A client
         that never runs JavaScript keeps a scrollable page and reads the footer in
         full. -->
    <style>
        /* One line, not a wall of copy. The long crawlable text moved to /about/,
           which is a real page for people and for crawlers; what stays here is the
           single link a no-JavaScript visitor needs, small enough that it reads as a
           footer rather than as the page. */
        .site-about {
            max-width: 46rem;
            margin: 0 auto;
            padding: 12px 1.25rem calc(12px + env(safe-area-inset-bottom, 0px));
            font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            text-align: center;
            color: color-mix(in srgb, currentColor 65%, transparent);
        }

        .site-about a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .site-about span + span::before {
            content: " · ";
        }
    </style>

<body class="text-gray-900 dark:text-white transition-colors duration-300">
    <div id="root"></div>
    <!-- Outside #root: index.tsx replaces #root's children on mount, so anything that
         must survive into the rendered DOM (this footer, for crawlers) has to live
         here, as a sibling. See the head comment above. -->
    <footer class="site-about">

    </footer>
