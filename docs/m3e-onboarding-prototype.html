<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Kira HRT Tracker · M3E Pixel 风格新手指引</title>
<style>
:root{
  --stage:#0c0a0e;--bg:#16121a;--sc:#211c25;--sch:#2c2630;--sch-h:#362f3b;
  --pri:#ffb1c8;--onpri:#5d1133;--pric:#7a2c4a;--onpric:#ffd9e3;
  --secc:#4e3a43;--onsecc:#fbdbe6;--terc:#4d3a14;--onterc:#ffdea8;
  --on:#eadfe6;--var:#cfc0c9;--out:#9a8d95;--ok:#7fe0a8;--okc:#1d3a2b;
  --err:#ffb4ab;--errc:#5c1916;--onerrc:#ffdad6;--warn:#ffca64;--warnc:#423008;
  --sh:0 24px 60px rgba(0,0,0,.55);
}
:root[data-theme="light"]{
  --stage:#e9e4ea;--bg:#fff8f8;--sc:#f9ecf0;--sch:#f2e3e9;--sch-h:#ead6de;
  --pri:#a03d63;--onpri:#ffffff;--pric:#ffd9e3;--onpric:#3f001e;
  --secc:#f6dbe5;--onsecc:#2b151e;--terc:#ffe3b0;--onterc:#261900;
  --on:#211a1d;--var:#4f4349;--out:#84757b;--ok:#2f8458;--okc:#d6f2e2;
  --err:#ba1a1a;--errc:#ffdad6;--onerrc:#410002;--warn:#825500;--warnc:#ffddb3;
  --sh:0 20px 50px rgba(80,30,50,.15);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;background:var(--stage);color:var(--on);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;transition:background .3s}
button,input{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;pointer-events:none}

/* 跨步骤翻页动画与像素试管浮动动画 */
@keyframes pageFade {
  0% { opacity:0; transform:translateX(14px); }
  100% { opacity:1; transform:translateX(0); }
}
@keyframes tubeFloat {
  0%,100% { transform:translateY(0) rotate(-6deg); }
  50% { transform:translateY(-4px) rotate(-2deg); }
}
@keyframes bubbleUp {
  0%,100% { transform:translateY(0); opacity:.95; }
  50% { transform:translateY(-3px); opacity:.55; }
}
.page-anim{animation:pageFade .32s cubic-bezier(.2,.9,.2,1) both}
.tube-float{animation:tubeFloat 3.8s ease-in-out infinite}
.px-bub1{animation:bubbleUp 2.2s ease-in-out infinite}
.px-bub2{animation:bubbleUp 2.8s ease-in-out .7s infinite}

/* 顶部画布调试控制栏 */
.top{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-wrap:wrap;justify-content:center;gap:3px;padding:4px;background:var(--sc);border-radius:99px;box-shadow:0 6px 24px rgba(0,0,0,.35);border:1px solid rgba(154,141,149,.18);max-width:98vw}
.top button{padding:5px 10px;border-radius:99px;font-size:11px;font-weight:700;color:var(--var);transition:.2s;white-space:nowrap}
.top button.on{background:var(--pric);color:var(--onpric)}
.top .sep{width:1px;background:rgba(154,141,149,.25);margin:4px 2px}

.wrap{height:100%;display:grid;place-items:center;padding:52px 12px 12px}
.phone{width:390px;height:820px;max-height:calc(100vh - 64px);background:var(--bg);border-radius:46px;border:7px solid #26202b;box-shadow:var(--sh);position:relative;overflow:hidden;display:flex;flex-direction:column;transition:width .4s cubic-bezier(.2,.9,.2,1),height .4s cubic-bezier(.2,.9,.2,1),border-radius .4s,background .3s}

/* M3E 标志性按压弹性圆角与缩放回弹动画 */
[data-m]{transition:border-radius .5s cubic-bezier(.3,1.8,.5,1),transform .35s cubic-bezier(.3,1.7,.5,1),background .25s,color .25s,border-color .25s}
[data-m].mo{border-radius:var(--mo,14px)!important;transform:scale(.95)}

/* Pixel 风格顶部进度与返回栏 */
.ob-top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;flex-shrink:0;z-index:5}
.back-pill{width:42px;height:42px;border-radius:21px;background:var(--sch);color:var(--on);display:grid;place-items:center;transition:opacity .25s,transform .35s cubic-bezier(.3,1.7,.5,1),border-radius .5s cubic-bezier(.3,1.8,.5,1)}
.back-pill.hide{opacity:0;pointer-events:none;transform:scale(.8)}
.prog-bar{display:flex;gap:4px;align-items:center}
.prog-seg{height:7px;width:12px;border-radius:99px;background:var(--sch);transition:width .45s cubic-bezier(.3,1.8,.5,1),background .3s}
.prog-seg.done{background:var(--pric);width:14px}
.prog-seg.on{background:var(--pri);width:32px}
.step-tag{font-size:12px;font-weight:800;color:var(--var);min-width:44px;text-align:right}

/* 主滚动与双栏容器 */
.ob-scroll{flex:1;overflow-y:auto;padding:8px 20px 110px;scrollbar-width:none;display:flex;flex-direction:column}
.ob-scroll::-webkit-scrollbar{display:none}
.ob-split{display:flex;flex-direction:column;gap:20px;flex:1}

/* 左栏/顶部：动态多边形徽章 + 像素紫色试剂试管 + 标题 */
.hero-pane{display:flex;flex-direction:column;align-items:flex-start;padding:4px 2px}
.morph-stage{width:84px;height:84px;position:relative;display:grid;place-items:center;margin-bottom:14px}
.morph-bg{position:absolute;inset:0;width:100%;height:100%;color:var(--pric);transition:transform .7s cubic-bezier(.22,1.2,.36,1),color .4s}
.morph-bg.terc{color:var(--terc)}
.morph-bg.secc{color:var(--secc)}
.morph-bg.okc{color:var(--okc)}
.pixel-logo{width:52px;height:52px;position:relative;z-index:2;filter:drop-shadow(0 6px 12px rgba(90,20,140,.35))}
.ob-title{font-size:28px;font-weight:800;letter-spacing:-.6px;line-height:1.2;color:var(--on);transition:opacity .2s}
.ob-sub{font-size:13.5px;color:var(--var);margin-top:8px;line-height:1.5}

/* Step 1: 语言选择（顶部最长一条 + 下方 6 个小块，保留丝滑圆角与缩放过渡） */
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lang-card{padding:15px 18px;border-radius:22px;background:var(--sch);color:var(--on);display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:700;border:1.5px solid rgba(255,255,255,.07);transition:border-radius .45s cubic-bezier(.3,1.8,.5,1),transform .35s cubic-bezier(.3,1.7,.5,1),background .25s,color .25s,border-color .25s}
:root[data-theme="light"] .lang-card{border-color:rgba(160,61,99,.14)}
.lang-card.sys-top{grid-column:span 2;padding:17px 20px;border-radius:24px}
.lang-card.on{background:var(--pri);color:var(--onpri);border-color:transparent;border-radius:99px}
.px-check{width:16px;height:16px;opacity:0;transform:scale(.5);transition:opacity .22s,transform .35s cubic-bezier(.3,1.8,.5,1);flex-shrink:0}
.lang-card.on .px-check{opacity:1;transform:scale(1)}

/* Step 2: HRT 类型双卡 */
.hrt-grid{display:flex;flex-direction:column;gap:10px}
.hrt-tile{padding:20px;border-radius:26px;background:var(--sch);color:var(--on);display:flex;align-items:center;gap:16px;text-align:left;transition:border-radius .5s cubic-bezier(.3,1.8,.5,1),transform .35s cubic-bezier(.3,1.7,.5,1),background .25s,color .25s}
.hrt-tile.mtf.on{background:var(--pric);color:var(--onpric);border-radius:42px 16px 42px 16px}
.hrt-tile.ftm.on{background:var(--terc);color:var(--onterc);border-radius:16px 42px 16px 42px}
.hrt-tile .ht-ic{width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex-shrink:0;transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
:root[data-theme="light"] .hrt-tile .ht-ic{background:rgba(0,0,0,.07)}
.hrt-tile.on .ht-ic{transform:scale(1.08)}
.hrt-tile .ht-t{font-size:17px;font-weight:800}
.hrt-tile .ht-s{font-size:12.5px;opacity:.82;margin-top:3px;line-height:1.4}

/* M3E 分段聚合列表 (.list / .li) */
.list{display:flex;flex-direction:column;gap:3px}
.li{background:var(--sch);padding:15px 16px;display:flex;align-items:center;gap:13px;min-height:70px;border-radius:8px;transition:border-radius .45s cubic-bezier(.3,1.8,.5,1),transform .35s cubic-bezier(.3,1.7,.5,1),background .2s}
.list>.li:first-child{border-radius:26px 26px 8px 8px}
.list>.li:last-child{border-radius:8px 8px 26px 26px}
.list>.li:only-child{border-radius:26px}
.ic{width:44px;height:44px;border-radius:22px;background:var(--secc);color:var(--onsecc);display:grid;place-items:center;flex-shrink:0}
.ic.p{background:var(--pric);color:var(--onpric)}
.ic.am{background:var(--terc);color:var(--onterc)}
.ic.ok{background:var(--okc);color:var(--ok)}
.tx{flex:1;min-width:0}
.t{font-size:14.5px;font-weight:700;color:var(--on)}
.s{font-size:12px;color:var(--var);margin-top:3px;line-height:1.42}
.day-badge{padding:5px 12px;border-radius:99px;background:var(--okc);color:var(--ok);font-size:12px;font-weight:800;white-space:nowrap;transition:opacity .25s,transform .3s cubic-bezier(.3,1.8,.5,1)}
.day-badge.hide{opacity:0;transform:scale(.8);pointer-events:none}

/* 开关 (.sw) */
.sw{width:50px;height:30px;border-radius:15px;background:var(--sc);border:2px solid var(--out);position:relative;transition:.25s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:5px;left:5px;width:16px;height:16px;border-radius:50%;background:var(--out);transition:.28s cubic-bezier(.3,1.7,.5,1)}
.sw.on{background:var(--pri);border-color:var(--pri)}
.sw.on::after{left:23px;top:3px;width:20px;height:20px;background:var(--onpri)}

/* Step 4: 体重英雄大磁贴 */
.weight-hero{position:relative;overflow:hidden;border-radius:30px;padding:20px 18px;background:var(--pric);color:var(--onpric);margin-bottom:10px}
.wh-main{display:flex;align-items:center;justify-content:space-between;margin:10px 0 18px}
.step-btn{width:54px;height:54px;border-radius:20px;background:rgba(255,255,255,.18);color:currentColor;display:grid;place-items:center;font-size:24px;font-weight:700}
:root[data-theme="light"] .step-btn{background:rgba(0,0,0,.08)}
.wh-input{width:136px;text-align:center;font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1;color:currentColor;border-bottom:2px dashed currentColor;padding-bottom:2px;transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.preset-row{display:flex;gap:6px}
.preset-pill{flex:1;padding:8px 6px;border-radius:14px;background:rgba(0,0,0,.2);color:currentColor;font-size:12.5px;font-weight:700;text-align:center;transition:border-radius .4s cubic-bezier(.3,1.8,.5,1),transform .3s cubic-bezier(.3,1.7,.5,1),background .2s,color .2s}
:root[data-theme="light"] .preset-pill{background:rgba(255,255,255,.55);color:var(--onpric)}
.preset-pill.on{background:var(--onpric);color:var(--pric);border-radius:99px;font-weight:800;transform:scale(1.04)}

/* 终章独立页面：零间隙跨性别旗帜 + 温柔寄语大卡片 */
.blessing-stage{position:relative;overflow:hidden;border-radius:34px;padding:28px 24px;background:linear-gradient(145deg,var(--pric),var(--secc));color:var(--onpric);box-shadow:0 16px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;justify-content:space-between;min-height:230px}
.blessing-cookie{position:absolute;right:-40px;bottom:-44px;width:170px;height:170px;opacity:.15;pointer-events:none}
.trans-flag-wrap{display:inline-flex;align-items:center;margin-bottom:18px;position:relative;z-index:1}
/* 零间隙五色跨性别旗帜容器（直接用SVG铺满+外描边，消除一切边缘缝隙） */
.trans-flag{width:54px;height:34px;border-radius:9px;display:block;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.22),0 0 0 1.5px rgba(255,255,255,.38)}
.blessing-quote{font-size:21px;font-weight:800;line-height:1.52;letter-spacing:-.3px;position:relative;z-index:1}
.blessing-sub{font-size:12.5px;font-weight:600;opacity:.85;margin-top:18px;position:relative;z-index:1}

/* Pixel 风格底部导航按钮栏 */
.ob-bot{position:absolute;left:0;right:0;bottom:0;padding:12px 20px 22px;background:linear-gradient(to top,var(--bg) 80%,transparent);display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:10}
.skip-btn{height:52px;padding:0 18px;border-radius:26px;background:var(--sch);color:var(--var);font-size:14px;font-weight:700}
.next-btn{flex:1;height:54px;border-radius:27px;background:var(--pri);color:var(--onpri);font-size:15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 26px rgba(0,0,0,.28)}

/* Snackbar */
#snack{position:absolute;left:20px;right:20px;bottom:86px;background:var(--on);color:var(--bg);padding:12px 16px;border-radius:16px;font-size:13px;font-weight:700;transform:translateY(30px);opacity:0;pointer-events:none;transition:.28s;z-index:40}
#snack.on{transform:none;opacity:1}

/* ================= 桌面端 / Pixel 平板双栏布局 ================= */
body.desktop .phone{width:880px;height:660px;max-height:calc(100vh - 68px);border-radius:38px}
body.desktop .ob-top{padding:22px 34px 12px}
body.desktop .ob-scroll{padding:12px 34px 104px;justify-content:center}
body.desktop .ob-split{display:grid;grid-template-columns:.88fr 1.18fr;gap:36px;align-items:center}
body.desktop .hero-pane{padding-right:10px}
body.desktop .morph-stage{width:108px;height:108px;margin-bottom:20px}
body.desktop .pixel-logo{width:66px;height:66px}
body.desktop .ob-title{font-size:32px}
body.desktop .ob-bot{padding:16px 34px 26px}
</style>
</head>
<body>

<!-- SVG 资源定义 -->
<svg width="0" height="0" style="position:absolute">
<defs>
  <symbol id="chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
  <symbol id="spark" viewBox="0 0 24 24"><path d="m12 3 2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2L12 3Z"/></symbol>

    <rect x="1.5" y="6.5" width="1.5" height="1.5" fill="currentColor"/>

  </symbol>

  <!-- 像素风紫色试剂试管 Logo -->
  <symbol id="pixelTube" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <rect x="6" y="1" width="4" height="1" fill="#f59e0b"/>

    <rect x="10" y="3" width="1" height="10" fill="#94a3b8"/>
    <rect x="6" y="13" width="1" height="1" fill="#cbd5e1"/>
    <rect x="9" y="13" width="1" height="1" fill="#94a3b8"/>
    <rect x="7" y="14" width="2" height="1" fill="#94a3b8"/>

    <rect x="6" y="6" width="4" height="1" fill="#e879f9"/>
    <rect x="6" y="7" width="4" height="3" fill="#a855f7"/>
    <rect x="6" y="10" width="4" height="3" fill="#7e22ce"/>

  </symbol>
</defs>
</svg>

<!-- 顶部预览切换栏 -->
<div class="top">
  <button id="vMob" class="on" onclick="setView(false)">手机</button>
  <button id="vDesk" onclick="setView(true)">桌面双栏</button>
  <div class="sep"></div>
  <button id="tDark" class="on" onclick="setTheme('dark')">深色</button>
  <button id="tLight" onclick="setTheme('light')">浅色</button>
  <div class="sep"></div>
  <button id="envBtn" onclick="toggleAndroidEnv()">环境: Web (8步)</button>
  <div class="sep"></div>
  <button onclick="jumpStepId('lang')">语言</button>
  <button onclick="jumpStepId('type')">类型</button>
  <button onclick="jumpStepId('date')">日期</button>
  <button onclick="jumpStepId('weight')">体重</button>
  <button onclick="jumpStepId('import')">导入</button>
  <button id="navAppBtn" onclick="jumpStepId('app')">应用</button>
  <button onclick="jumpStepId('privacy')">安全</button>
  <button onclick="jumpStepId('bloom')">绽放</button>
</div>

<div class="wrap">
  <div class="phone">
    <!-- 1. Pixel 风格顶部进度条 -->
    <div class="ob-top">
      <button class="back-pill hide" id="backBtn" data-m style="--mo:12px" onclick="prevStep()">
        <svg class="i" style="transform:rotate(180deg)"><use href="#chev"/></svg>
      </button>
      <div class="prog-bar" id="progBar"></div>
      <span class="step-tag" id="stepCounter">1 / 8</span>
    </div>

    <!-- 2. 主内容区 -->
    <div class="ob-scroll">
      <div class="ob-split">
        <!-- 左栏/顶部：多边形徽章 + 像素紫色试剂试管 + 标题 -->
        <div class="hero-pane">
          <div class="morph-stage">
            <svg class="morph-bg" id="heroMorphSvg" viewBox="-50 -50 100 100">
              <path id="heroMorphPath" fill="currentColor"/>
            </svg>
            <svg class="pixel-logo tube-float"><use href="#pixelTube"/></svg>
          </div>
          <h1 class="ob-title" id="stepTitle">欢迎来到<br>Kira HRT Tracker</h1>
          <p class="ob-sub" id="stepSub"></p>
        </div>

        <!-- 右栏/下部：各步骤动态交互面板 -->
        <div id="stepContent"></div>
      </div>
    </div>

    <!-- 3. Pixel 风格底部操作栏 -->
    <div class="ob-bot">
      <button class="skip-btn" id="skipBtn" data-m style="--mo:14px" onclick="skipToEnd()">跳过</button>
      <button class="next-btn" id="nextBtn" data-m style="--mo:16px" onclick="nextStep()">
        <span id="nextBtnText">下一步</span>
        <svg class="i"><use href="#chev"/></svg>
      </button>
    </div>

    <div id="snack"><span id="snackText">提示</span></div>
  </div>
</div>

<script>
// 曲奇与繁花多边形生成器
function cookie(cx,cy,r,n,a){
  const pts=[];
  for(let i=0;i<=120;i++){
    const t=i/120*Math.PI*2, rr=r*(1+a*Math.cos(n*t));
    pts.push(`${i?'L':'M'}${(cx+rr*Math.cos(t)).toFixed(2)},${(cy+rr*Math.sin(t)).toFixed(2)}`);
  }
  return pts.join(' ')+'Z';
}

// 捕获浏览器原生 PWA 安装事件
let deferredPwaPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPwaPrompt = e;
});

// 状态变量
let isAndroidApp = false;
let curStepIdx = 0;
let selLang = 'zh-CN';
let hrtMode = 'mtf';
let notStartedYet = false;
let startDateStr = '2025年 5月 9日';
let startDaysCount = 529;
let weightKg = 58.0;

// 7 种语言（第 1 项排在最上方占满整行，但不写“系统语言”四个字！）
const LANGS = [
  { code:'zh-CN', name:'简体中文', isSys:true, welcome:'欢迎来到<br>Kira HRT Tracker', sub:'请选择你的界面语言，随时可在设置中更改。' },
  { code:'zh-TW', name:'正體中文', welcome:'歡迎來到<br>Kira HRT Tracker', sub:'請選擇你的介面語言，隨時可在設定中更改。' },
  { code:'yue', name:'廣東話', welcome:'歡迎嚟到<br>Kira HRT Tracker', sub:'請揀選你嘅介面語言，隨時可以喺設定度改。' },
  { code:'en', name:'English', welcome:'Welcome to<br>Kira HRT Tracker', sub:'Choose your display language. You can change it anytime in Settings.' },
  { code:'ja', name:'日本語', welcome:'Kira HRT Tracker<br>へようこそ', sub:'表示言語を選択してください。設定からいつでも変更できます。' },
  { code:'ko', name:'한국어', welcome:'Kira HRT Tracker에<br>오신 것을 환영합니다', sub:'표시 언어를 선택하세요. 설정에서 언제든 변경할 수 있습니다.' },
  { code:'tr', name:'Türkçe', welcome:'Kira HRT Tracker\'a<br>Hoş Geldiniz', sub:'Görüntüleme dilinizi seçin. Ayarlardan istediğiniz zaman değiştirebilirsiniz.' }
];

const ALL_STEPS = [
  { id:'lang', lobes:9, amp:0.09, tone:'', title:() => (LANGS.find(l => l.code === selLang) || LANGS[0]).welcome, sub:() => (LANGS.find(l => l.code === selLang) || LANGS[0]).sub },
  { id:'type', lobes:8, amp:0.11, tone:'', title:() => '选择 HRT 类型', sub:() => '' },
  { id:'date', lobes:7, amp:0.09, tone:'', title:() => 'HRT 开始日期', sub:() => '' },
  { id:'weight', lobes:6, amp:0.08, tone:'terc', title:() => '设置你的体重', sub:() => '' },
  { id:'import', lobes:10, amp:0.09, tone:'secc', title:() => '从其他软件<br>导入数据', sub:() => '' },
  { id:'app', lobes:8, amp:0.10, tone:'secc', title:() => '下载 Android 版<br>或安装 PWA', sub:() => '' },
  { id:'privacy', lobes:9, amp:0.08, tone:'okc', title:() => '隐私保护<br>与重要声明', sub:() => '' },
  { id:'bloom', lobes:12, amp:0.10, tone:'', title:() => '一切准备就绪', sub:() => '' }
];

function getActiveSteps() {
  return isAndroidApp ? ALL_STEPS.filter(s => s.id !== 'app') : ALL_STEPS;
}

// 仅在切换步骤时构建 DOM；页内点击通过 class 切换保留全部 CSS 弹性动画！
function renderStep() {
  const steps = getActiveSteps();
  if (curStepIdx >= steps.length) curStepIdx = steps.length - 1;
  const meta = steps[curStepIdx];
  const isLast = curStepIdx === steps.length - 1;

  // 1. 顶部进度条（保留既有 DOM 以触发 width 弹簧过渡）
  document.getElementById('backBtn').classList.toggle('hide', curStepIdx === 0);
  document.getElementById('stepCounter').textContent = `${curStepIdx + 1} / ${steps.length}`;
  const pb = document.getElementById('progBar');
  if (pb.children.length !== steps.length) {
    pb.innerHTML = steps.map(() => `<div class="prog-seg"></div>`).join('');
  }
  Array.from(pb.children).forEach((seg, i) => {
    seg.className = 'prog-seg' + (i === curStepIdx ? ' on' : (i < curStepIdx ? ' done' : ''));
  });

  // 2. 顶部多边形徽章与标题
  const svgEl = document.getElementById('heroMorphSvg');
  svgEl.setAttribute('class', 'morph-bg ' + meta.tone);
  svgEl.style.transform = `rotate(${curStepIdx * 32}deg)`;
  document.getElementById('heroMorphPath').setAttribute('d', cookie(0, 0, 44, meta.lobes, meta.amp));
  document.getElementById('stepTitle').innerHTML = meta.title();
  const subEl = document.getElementById('stepSub');
  const subText = meta.sub();
  subEl.textContent = subText;
  subEl.style.display = subText ? 'block' : 'none';

  // 3. 底部按钮栏
  const nextBtn = document.getElementById('nextBtn');
  const skipBtn = document.getElementById('skipBtn');
  if (isLast) {
    skipBtn.style.display = 'none';
    nextBtn.innerHTML = `<svg class="i"><use href="#check"/></svg><span>进入 Kira HRT Tracker</span>`;
  } else {
    skipBtn.style.display = 'inline-block';
    nextBtn.innerHTML = `<span>下一步</span><svg class="i"><use href="#chev"/></svg>`;
  }

  // 4. 渲染步骤面板并播放跨页过渡动画
  const box = document.getElementById('stepContent');
  box.classList.remove('page-anim');
  void box.offsetWidth;
  box.classList.add('page-anim');

  if (meta.id === 'lang') {
    box.innerHTML = `
      <div class="lang-grid" id="langGrid">
        ${LANGS.map(l => `
          <button class="lang-card ${l.isSys ? 'sys-top' : ''} ${selLang === l.code ? 'on' : ''}" data-code="${l.code}" data-m style="--mo:14px" onclick="pickLang('${l.code}')">
            <span>${l.name}</span>
            <svg class="px-check"><use href="#pxCheck"/></svg>
          </button>
        `).join('')}
      </div>
    `;
  } else if (meta.id === 'type') {
    box.innerHTML = `
      <div class="hrt-grid">
        <button class="hrt-tile mtf ${hrtMode === 'mtf' ? 'on' : ''}" id="tileMtf" data-m style="--mo:20px" onclick="setMode('mtf')">
          <div class="ht-ic"><svg class="i"><use href="#spark"/></svg></div>
          <div>
            <div class="ht-t">女性化 HRT (MTF)</div>
            <div class="ht-s">雌激素 · 抗雄 · 孕激素/SERM · 毛发<br>支持原版 Mihari 与 Transmtf 模型</div>
          </div>
        </button>
        <button class="hrt-tile ftm ${hrtMode === 'ftm' ? 'on' : ''}" id="tileFtm" data-m style="--mo:20px" onclick="setMode('ftm')">
          <div class="ht-ic"><svg class="i"><use href="#shield"/></svg></div>
          <div>
            <div class="ht-t">男性化 HRT (FTM)</div>
            <div class="ht-s">雄激素 · 周期管理 · 毛发<br>支持睾酮酯当量换算与曲线估算</div>
          </div>
        </button>
      </div>
    `;
  } else if (meta.id === 'date') {
    // 直接做成一个可点击的选项行，点击唤起独立的日期选择器组件
    box.innerHTML = `
      <div class="list">
        <div class="li" style="cursor:pointer" data-m style="--mo:18px" onclick="openStandaloneDatePicker()">
          <div class="ic p"><svg class="i"><use href="#cal"/></svg></div>
          <div class="tx">
            <div class="t" id="dateMainTitle">${notStartedYet ? '暂不设置起始日期' : startDateStr}</div>
            <div class="s" id="dateSubTitle">${notStartedYet ? '点击可选择具体日期' : '点击打开日期选择器修改'}</div>
          </div>
          <span class="day-badge ${notStartedYet ? 'hide' : ''}" id="dateBadge">第 ${startDaysCount} 天</span>
          <svg class="i" style="color:var(--var)"><use href="#chev"/></svg>
        </div>
        <div class="li" style="cursor:pointer" data-m style="--mo:18px" onclick="toggleNotStarted()">
          <div class="tx">
            <div class="t">我还没正式开始 / 稍后再填</div>
            <div class="s">随时可在「账户」页的纪念日卡片中设置或修改</div>
          </div>
          <div class="sw ${notStartedYet ? 'on' : ''}" id="notStartedSw"></div>
        </div>
      </div>
    `;
  } else if (meta.id === 'weight') {
    box.innerHTML = `
      <div class="weight-hero">
        <div style="font-size:13px;font-weight:800;opacity:.9">当前体重 (kg)</div>
        <div class="wh-main">
          <button class="step-btn" data-m style="--mo:26px 10px 26px 10px" onclick="stepWeight(-1)">−</button>
          <div style="text-align:center">
            <input type="number" id="weightInput" class="wh-input" value="${weightKg.toFixed(1)}" step="0.5" oninput="onWeightInput(this.value)" />
            <span style="font-size:16px;font-weight:800;margin-left:4px">kg</span>
          </div>
          <button class="step-btn" data-m style="--mo:10px 26px 10px 26px" onclick="stepWeight(1)">+</button>
        </div>
        <div class="preset-row" id="weightPresets">
          ${[45, 55, 65, 75].map(w => `
            <button class="preset-pill ${Math.abs(weightKg - w) < 0.2 ? 'on' : ''}" data-w="${w}" data-m style="--mo:10px" onclick="setWeight(${w})">${w} kg</button>
          `).join('')}
        </div>
      </div>
      <div class="list">
        <div class="li">
          <div class="ic"><svg class="i"><use href="#info"/></svg></div>
          <div class="tx">
            <div class="t">为什么需要体重？</div>
            <div class="s">体重仅用于药代动力学模型估算体液分布容积，若不修改将默认按 60 kg 计算。</div>
          </div>
        </div>
      </div>
    `;
  } else if (meta.id === 'import') {
    box.innerHTML = `
      <div class="list">
        <div class="li" style="cursor:pointer" data-m style="--mo:18px" onclick="toast('已打开备份文件选择器 (JSON / CSV)')">
          <div class="ic p"><svg class="i"><use href="#upload"/></svg></div>
          <div class="tx">
            <div class="t">立即选择备份文件导入</div>
            <div class="s">兼容 Kira · Oyama · Transmtf · Featherline 导出的 JSON 与 CSV 格式</div>
          </div>
          <svg class="i" style="color:var(--var)"><use href="#chev"/></svg>
        </div>
        <div class="li">
          <div class="ic"><svg class="i"><use href="#info"/></svg></div>
          <div class="tx">
            <div class="t">稍后在哪里导入？</div>
            <div class="s">进入应用后，你随时可以在「设置 - 数据管理 - 导入数据」中导入或合并备份记录。</div>
          </div>
        </div>
      </div>
    `;
  } else if (meta.id === 'app') {
    box.innerHTML = `
      <div class="list">
        <div class="li" style="cursor:pointer" data-m style="--mo:18px" onclick="toast('正在开始下载 Android 客户端安装包 (.apk)')">
          <div class="ic am"><svg class="i"><use href="#download"/></svg></div>
          <div class="tx">
            <div class="t">下载 Android 客户端</div>
            <div class="s">获取独立 APK 安装包，支持本地排程服药通知与返回手势</div>
          </div>
          <svg class="i" style="color:var(--var)"><use href="#chev"/></svg>
        </div>
        <div class="li" style="cursor:pointer" data-m style="--mo:18px" onclick="triggerPwaInstall()">
          <div class="ic ok"><svg class="i"><use href="#pwa"/></svg></div>
          <div class="tx">
            <div class="t">安装为 PWA 离线应用</div>
            <div class="s">点击直接唤起浏览器安装弹窗，添加到主屏幕或桌面后断网也可使用</div>
          </div>
          <svg class="i" style="color:var(--var)"><use href="#chev"/></svg>
        </div>
      </div>
    `;
  } else if (meta.id === 'privacy') {
    box.innerHTML = `
      <div class="list">
        <div class="li">
          <div class="ic ok"><svg class="i"><use href="#shield"/></svg></div>
          <div class="tx">
            <div class="t">硬件安全模块与系统 Keystore 保护</div>
            <div class="s">云端密钥受硬件安全模块 (HSM) 保护，本机凭据存储于系统级 Keystore；化验单 OCR 识别完全在本机离线完成，照片绝不上传。</div>
          </div>
        </div>
        <div class="li">
          <div class="ic am"><svg class="i"><use href="#warn"/></svg></div>
          <div class="tx">
            <div class="t">非医疗器械声明</div>
            <div class="s">本软件提供的药代动力学曲线与校准数值仅作个人记录参考，不是医疗器械，亦不构成任何医疗诊断或处方建议。请遵医嘱定期复查。</div>
          </div>
        </div>
      </div>
    `;
  } else if (meta.id === 'bloom') {
    // 零间隙跨性别旗帜（preserveAspectRatio="none" + 条纹微重叠防缝隙）
    box.innerHTML = `
      <div class="blessing-stage" data-m style="--mo:24px">
        <svg class="blessing-cookie" viewBox="-70 -70 140 140"><path d="${cookie(0,0,64,12,0.09)}" fill="currentColor"/></svg>
        <div>
          <div class="trans-flag-wrap">
            <svg class="trans-flag" viewBox="0 0 54 34" preserveAspectRatio="none">
              <rect x="0" y="0" width="54" height="7.2" fill="#5BCEFA"/>
              <rect x="0" y="6.8" width="54" height="7.2" fill="#F5A9B8"/>
              <rect x="0" y="13.6" width="54" height="7.2" fill="#FFFFFF"/>
              <rect x="0" y="20.4" width="54" height="7.2" fill="#F5A9B8"/>
              <rect x="0" y="27.2" width="54" height="6.8" fill="#5BCEFA"/>
            </svg>
          </div>
          <div class="blessing-quote">愿我们被世界温柔以待，<br>自由而灿烂地绽放</div>
        </div>
        <div class="blessing-sub">Kira HRT Tracker</div>
      </div>
    `;
  }
}

// 页内选项交互：只切换原 DOM 节点的 class，绝不重刷 innerHTML，保留 100% 丝滑圆角与按压动画！
function pickLang(code) {
  selLang = code;
  const langObj = LANGS.find(l => l.code === code) || LANGS[0];
  document.getElementById('stepTitle').innerHTML = langObj.welcome;
  document.getElementById('stepSub').textContent = langObj.sub;
  document.querySelectorAll('#langGrid .lang-card').forEach(btn => {
    btn.classList.toggle('on', btn.dataset.code === code);
  });
}

function setMode(m) {
  hrtMode = m;
  const mtfEl = document.getElementById('tileMtf');
  const ftmEl = document.getElementById('tileFtm');
  if (mtfEl) mtfEl.classList.toggle('on', m === 'mtf');
  if (ftmEl) ftmEl.classList.toggle('on', m === 'ftm');
}

function openStandaloneDatePicker() {
  notStartedYet = false;
  syncDateRowUI();
  toast('已唤起独立的 M3E 日期选择器组件');
}

function toggleNotStarted() {
  notStartedYet = !notStartedYet;
  syncDateRowUI();
}

function syncDateRowUI() {
  const sw = document.getElementById('notStartedSw');
  const mainT = document.getElementById('dateMainTitle');
  const subT = document.getElementById('dateSubTitle');
  const badge = document.getElementById('dateBadge');
  if (sw) sw.classList.toggle('on', notStartedYet);
  if (mainT) mainT.textContent = notStartedYet ? '暂不设置起始日期' : startDateStr;
  if (subT) subT.textContent = notStartedYet ? '点击可选择具体日期' : '点击打开日期选择器修改';
  if (badge) badge.classList.toggle('hide', notStartedYet);
}

function stepWeight(delta) {
  weightKg = Math.max(30, Math.min(180, Number((weightKg + delta).toFixed(1))));
  syncWeightUI();
}
function setWeight(w) {
  weightKg = w;
  syncWeightUI();
}
function onWeightInput(val) {
  weightKg = parseFloat(val) || 60;
  document.querySelectorAll('#weightPresets .preset-pill').forEach(btn => {
    btn.classList.toggle('on', Math.abs(parseFloat(btn.dataset.w) - weightKg) < 0.2);
  });
}
function syncWeightUI() {
  const inp = document.getElementById('weightInput');
  if (inp) {
    inp.value = weightKg.toFixed(1);
    inp.style.transform = 'scale(1.05)';
    setTimeout(() => inp.style.transform = '', 180);
  }
  document.querySelectorAll('#weightPresets .preset-pill').forEach(btn => {
    btn.classList.toggle('on', Math.abs(parseFloat(btn.dataset.w) - weightKg) < 0.2);
  });
}

async function triggerPwaInstall() {
  if (deferredPwaPrompt) {
    deferredPwaPrompt.prompt();
    await deferredPwaPrompt.userChoice;
    deferredPwaPrompt = null;
  } else {
    toast('已触发 PWA 安装（iOS Safari 请点击底部分享按钮 -> 添加到主屏幕）');
  }
}

function toggleAndroidEnv() {
  isAndroidApp = !isAndroidApp;
  const btn = document.getElementById('envBtn');
  btn.textContent = isAndroidApp ? '环境: Android App (7步)' : '环境: Web (8步)';
  btn.classList.toggle('on', isAndroidApp);
  document.getElementById('navAppBtn').style.display = isAndroidApp ? 'none' : 'inline-block';
  curStepIdx = 0;
  renderStep();
}

function jumpStepId(id) {
  const steps = getActiveSteps();
  const idx = steps.findIndex(s => s.id === id);
  if (idx !== -1) {
    curStepIdx = idx;
    renderStep();
  }
}
function nextStep() {
  const steps = getActiveSteps();
  if (curStepIdx < steps.length - 1) {
    curStepIdx++;
    renderStep();
  } else {
    toast('已完成初始化设置，正在进入主页');
  }
}
function prevStep() {
  if (curStepIdx > 0) {
    curStepIdx--;
    renderStep();
  }
}
function skipToEnd() {
  const steps = getActiveSteps();
  curStepIdx = steps.length - 1;
  renderStep();
}

function setView(desk) {
  document.body.classList.toggle('desktop', desk);
  document.getElementById('vMob').classList.toggle('on', !desk);
  document.getElementById('vDesk').classList.toggle('on', desk);
}
function setTheme(t) {
  if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  document.getElementById('tDark').classList.toggle('on', t === 'dark');
  document.getElementById('tLight').classList.toggle('on', t === 'light');
}

let st;
function toast(msg) {
  const s = document.getElementById('snack');
  document.getElementById('snackText').textContent = msg;
  s.classList.add('on');
  clearTimeout(st);
  st = setTimeout(() => s.classList.remove('on'), 2400);
}

// 全局按压圆角形变与回弹 [data-m]
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-m]');
  if (el) el.classList.add('mo');
});
['pointerup','pointercancel'].forEach(ev => document.addEventListener(ev, () => {
  setTimeout(() => document.querySelectorAll('.mo').forEach(el => el.classList.remove('mo')), 260);
}));

// 初始化
renderStep();
</script>
</body>
</html>
