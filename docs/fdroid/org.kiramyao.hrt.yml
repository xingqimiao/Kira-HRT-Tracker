#
# This is a starting point for an fdroiddata entry, written against the tree as it
# stands. A Tauri/Android build is not one of F-Droid's common recipes, so expect to
# iterate with their reviewers on the `Builds:` block — the parts below that are
# guesses are marked TODO. Everything outside `Builds:` is straightforward.
#
# Submit as: a merge request to https://gitlab.com/fdroid/fdroiddata adding
# metadata/org.kiramyao.hrt.yml. The app's listing text, icon and screenshots come
# from the `fastlane/metadata/android/` tree in the app repo, so they are not repeated
# here.

Categories:
  - Health & Fitness

License: MIT

AutoName: Kira HRT

WebSite: https://hrt.kiramyao.com
SourceCode: https://github.com/xingqimiao/Kira-HRT-Tracker
IssueTracker: https://github.com/xingqimiao/Kira-HRT-Tracker/issues
Changelog: https://github.com/xingqimiao/Kira-HRT-Tracker/blob/rewrite/CHANGELOG.md

RepoType: git
Repo: https://github.com/xingqimiao/Kira-HRT-Tracker.git

# The records sync server is part of the same repository and is optional: without an
# account the app is fully local. Worth saying so in the MR description so a reviewer
# does not read "sync server" as a hard dependency.
#
# Anti-features to discuss in the MR: the app offers optional sign-in with Google and
# X, which are non-free network services. It works without them. If F-Droid's policy
# team considers that enough for NonFreeNet, declare it rather than argue.

Builds:
  - versionName: 2.0.3
    versionCode: 2000003
    commit: 03a3421   # tag v2.0.3 — the commit this store build was built from
    # `src-tauri/gen/` is gitignored — the Android Gradle project is generated. The
    # recipe therefore has to run `tauri android init` itself (see `init`), which needs
    # the Tauri CLI, the Android SDK/NDK and Rust on the buildserver.
    subdir: src-tauri/gen/android
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    # TODO: pin the Rust toolchain and the NDK to the versions the release APK used.
    #   Rust: 1.8x (see src-tauri/rust-toolchain.toml if it is added)
    #   NDK:  the version Tauri picked when gen/ was generated
    # TODO: the buildserver is offline during `build`, so crates must be vendored:
    #   `cargo vendor --locked` in prebuild and a .cargo/config.toml that points at it.
    init:
      - npm ci
      - npx @tauri-apps/cli android init
    prebuild:
      - export HRT_NO_FCM=1 VITE_NO_SELF_UPDATE=1
      - export VITE_API_ORIGIN=https://api.kiramyao.com/hrt VITE_PUBLIC_ORIGIN=https://hrt.kiramyao.com
      - npm ci
    build:
      - export HRT_NO_FCM=1 VITE_NO_SELF_UPDATE=1
      - export VITE_API_ORIGIN=https://api.kiramyao.com/hrt VITE_PUBLIC_ORIGIN=https://hrt.kiramyao.com
      - npx @tauri-apps/cli android build --apk --target aarch64
      - cp ../../../app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk /tmp/app.apk
    output: /tmp/app.apk
    # No google-services.json is needed: scripts/strip-fcm.mjs removes the
    # google-services plugin and the Firebase deps before Gradle configures. The
    # build is expected to run `npm run build:android` through Tauri's
    # beforeBuildCommand, which is where that script is invoked.

MaintainerNotes: |-
  The F-Droid build must set HRT_NO_FCM=1 and VITE_NO_SELF_UPDATE=1. The first removes
  Firebase/FCM from the Android module and from the vendored notifications plugin; the
  second folds the update manifest URL out of the bundle and hides the update item, so
  the app never checks for or installs its own updates. scripts/strip-fcm.mjs fails the
  build if only one of the two is set.
