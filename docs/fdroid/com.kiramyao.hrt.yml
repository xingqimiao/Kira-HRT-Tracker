Builds:
  - versionName: 2.1.0
    versionCode: 2001000
    commit: 9a0622109ec5d0a93a83924f2b71fce78476b9a3
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm rustup build-essential pkg-config
    init:
      - npm ci
      - rustup default stable
      - rustup target add aarch64-linux-android
      - export PATH="$HOME/.cargo/bin:$PATH"
      - export ANDROID_HOME=/opt/android-sdk
      - export ANDROID_SDK_ROOT=/opt/android-sdk
      - npx @tauri-apps/cli android init
    output: 
      src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
    prebuild:
      - export HRT_NO_FCM=1 VITE_NO_SELF_UPDATE=1
      - export VITE_API_ORIGIN=https://api.kiramyao.com/hrt VITE_PUBLIC_ORIGIN=https://hrt.kiramyao.com
      - npm ci
      - export PATH="$HOME/.cargo/bin:$PATH"
      - mkdir -p src-tauri/.cargo
      - (cd src-tauri && cargo vendor --locked vendor > .cargo/config.toml)
    scanignore:
      - node_modules
      - src-tauri/vendor
    build:
      - export HRT_NO_FCM=1 VITE_NO_SELF_UPDATE=1
      - export VITE_API_ORIGIN=https://api.kiramyao.com/hrt VITE_PUBLIC_ORIGIN=https://hrt.kiramyao.com
      - export PATH="$HOME/.cargo/bin:$PATH"
      - export ANDROID_HOME=/opt/android-sdk
      - export ANDROID_SDK_ROOT=/opt/android-sdk
      - node node_modules/@tauri-apps/cli/tauri.js android build --apk --target aarch64
      - cp 
        src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
        /tmp/app.apk
    ndk: 27.0.12077973

MaintainerNotes: |-
  Version metadata is Static, not Tags: checkupdates reads AndroidManifest.xml or
  build.gradle to learn versionName/versionCode, and a Tauri app has neither — the
  version lives in src-tauri/tauri.conf.json and the versionCode is generated into
  src-tauri/gen/android/app/tauri.properties at build time, so no committed file holds
  the pair. CurrentVersion/CurrentVersionCode are bumped here on every release; v2.1.0
  is commit 9a0622109ec5d0a93a83924f2b71fce78476b9a3, tag v2.1.0.

  scanignore covers node_modules and src-tauri/vendor: both are generated (npm ci,
  cargo vendor) and both carry prebuilt binaries the scanner refuses (winapi .a,
  onnxruntime wasm, sharp .so); nothing in them is committed. strip-fcm patches the
  vendored notifications crate as well, so the APK links no Firebase even though the
  vendored copy is what Gradle compiles.

  The F-Droid build must set HRT_NO_FCM=1 and VITE_NO_SELF_UPDATE=1. The first removes
  Firebase/FCM from the Android module and from the vendored notifications plugin; the
  second folds the update manifest URL out of the bundle and hides the update item, so
  the app never checks for or installs its own updates. scripts/strip-fcm.mjs fails the
  build if only one of the two is set.

  No google-services.json is needed: scripts/strip-fcm.mjs removes the google-services
  plugin and the Firebase dependencies before Gradle configures. Tauri's
  beforeBuildCommand runs `npm run build:android`, which is where that script is invoked.

  The first OCR use fetches ~23 MB (two ONNX models plus the ONNX Runtime wasm) from
  https://hrt.kiramyao.com/ocr/ — the native build does not bundle them. It is
  user-initiated (the scan action), cached afterwards, byte-identical to the web
  deploy, and no third-party CDN is involved. The files are the open-source
  PP-OCRv6 small detector/recogniser (Apache-2.0, PaddlePaddle) and ONNX Runtime Web
  (MIT) — no proprietary weights, nothing compiled for this app; provenance and
  revisions are in THIRD-PARTY-LICENSES.md. Say so if it should be bundled instead.

  Rust 1.90 (src-tauri/Cargo.toml `rust-version`) and NDK 27.0.12077973 are what the
  release APK used. Crates have to be vendored for the offline build step: `cargo
  vendor --locked` in prebuild plus a .cargo/config.toml pointing at the vendor dir.

  The pharmacokinetic model is credited to
  LaoZhong-Mihari/HRT-Recorder-PKcomponent-Test, but no code from that repository is
  distributed. The closed-form kernels are an independent implementation in
  src/pk/kernels.ts, and the parameters cite the primary literature; the upstream
  non-commercial grant is therefore not a dependency. See THIRD-PARTY-LICENSES.md.

